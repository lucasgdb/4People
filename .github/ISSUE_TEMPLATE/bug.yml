name: Reportar um problema
description: Algo não funciona como deveria em uma ferramenta ou no site.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o 4People! Quanto mais detalhes, mais rápido dá para corrigir.
        Antes de abrir, veja se já não existe uma [issue parecida](https://github.com/lucasgdb/4People/issues).
  - type: input
    id: url
    attributes:
      label: Página
      description: Endereço da ferramenta ou página com o problema.
      placeholder: https://4people.lucasbittencourt.dev/computacao/geradores/gerador-de-cpf
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descreva o problema. Se houver mensagem de erro, copie aqui.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Passo a passo, incluindo o que você digitou ou escolheu.
      placeholder: |
        1. Abri o gerador de CPF
        2. Escolhi o estado SP
        3. Cliquei em "Gerar novos CPFs"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Aparelho
      options:
        - Computador
        - Celular
        - Tablet
        - App instalado (PWA)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 140 no Android 15
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de tela
      description: Arraste imagens ou vídeos para cá, se ajudarem a entender.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Não incluí dados pessoais reais (CPF, senhas, tokens) na descrição nem nas imagens.
          required: true
